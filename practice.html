<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pathology Navigator MCQ Practice</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      color: #222;
      line-height: 1.6;
      background-color: #f7f9fc;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 60px 20px;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      color: #1a3c5e;
      margin-bottom: 16px;
    }

    .intro {
      font-size: 1.05rem;
      color: #444;
      margin-bottom: 28px;
    }

    ul {
      list-style: none;
      text-align: left;
      margin-bottom: 32px;
    }

    li {
      padding: 10px 0;
      font-size: 1rem;
      border-bottom: 1px solid #e0e0e0;
    }

    li::before {
      content: "✓ ";
      color: #f0a500;
      font-weight: bold;
    }

    .btn {
      display: inline-block;
      background-color: #1a3c5e;
      color: #fff;
      padding: 14px 32px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }

    .btn:hover {
      background-color: #12293f;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Pathology Navigator MCQ Practice</h1>
    <p class="intro">
      Sharpen your pathology knowledge with quick, focused MCQ practice sets — perfect for daily revision.
    </p>

    <ul>
      <li>Practice topic-wise MCQs at your own pace</li>
      <li>Get instant feedback after every question</li>
      <li>Track your progress as you improve</li>
    </ul>

    <button class="btn" type="button">Start Practice</button>
  </div>

</body>
</html>
