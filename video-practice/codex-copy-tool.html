<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pathology Points Tool</title>
  <style>
    :root {
      color-scheme: light;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --text: #172033;
      --muted: #64748b;
      --border: #d9e2ef;
      --surface: #ffffff;
      --success: #15803d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px 16px;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(145deg, #eff6ff, #f8fafc 55%, #eef2ff);
    }

    .tool {
      width: min(100%, 720px);
      padding: clamp(20px, 5vw, 36px);
      background: var(--surface);
      border: 1px solid rgba(217, 226, 239, 0.8);
      border-radius: 20px;
      box-shadow: 0 18px 45px rgba(30, 64, 175, 0.12);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.6rem, 6vw, 2.25rem);
      line-height: 1.15;
    }

    .intro {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    textarea {
      width: 100%;
      min-height: 280px;
      padding: 16px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 12px;
      font: inherit;
      font-size: 1rem;
      line-height: 1.55;
      color: var(--text);
      background: #fbfdff;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .meta {
      min-height: 24px;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    #status {
      color: var(--success);
      font-weight: 700;
    }

    .actions {
      margin-top: 18px;
      display: flex;
      gap: 12px;
    }

    button {
      min-height: 48px;
      padding: 12px 18px;
      border: 0;
      border-radius: 11px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease;
    }

    button:active {
      transform: translateY(1px);
    }

    #copyButton {
      flex: 1;
      color: #ffffff;
      background: var(--primary);
    }

    #copyButton:hover {
      background: var(--primary-dark);
    }

    #clearButton {
      color: #334155;
      background: #e9eff7;
    }

    #clearButton:hover {
      background: #dce5f0;
    }

    button:focus-visible {
      outline: 3px solid rgba(37, 99, 235, 0.35);
      outline-offset: 2px;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
        place-items: start center;
      }

      .tool {
        border-radius: 16px;
      }

      textarea {
        min-height: 50vh;
      }

      .actions {
        flex-direction: column;
      }

      #clearButton {
        order: 2;
      }
    }
  </style>
</head>
<body>
  <main class="tool">
    <h1>Pathology Points Tool</h1>
    <p class="intro">Enter or paste your pathology points below, then copy them all in one tap.</p>

    <label for="points">Pathology points</label>
    <textarea id="points" placeholder="Enter each pathology point on a new line..." autofocus></textarea>

    <div class="meta">
      <span id="status" role="status" aria-live="polite"></span>
      <span><span id="characterCount">0</span> characters</span>
    </div>

    <div class="actions">
      <button id="copyButton" type="button">Copy All Points</button>
      <button id="clearButton" type="button">Clear</button>
    </div>
  </main>

  <script>
    const points = document.getElementById('points');
    const characterCount = document.getElementById('characterCount');
    const status = document.getElementById('status');
    const copyButton = document.getElementById('copyButton');
    const clearButton = document.getElementById('clearButton');
    let statusTimer;

    function updateCount() {
      characterCount.textContent = points.value.length.toLocaleString();
    }

    function showStatus(message) {
      clearTimeout(statusTimer);
      status.textContent = message;
      statusTimer = setTimeout(() => {
        status.textContent = '';
      }, 1800);
    }

    async function copyAllPoints() {
      if (!points.value) {
        points.focus();
        return;
      }

      try {
        await navigator.clipboard.writeText(points.value);
      } catch (error) {
        points.select();
        document.execCommand('copy');
        points.setSelectionRange(points.value.length, points.value.length);
      }

      showStatus('Copied!');
    }

    points.addEventListener('input', updateCount);
    copyButton.addEventListener('click', copyAllPoints);
    clearButton.addEventListener('click', () => {
      points.value = '';
      status.textContent = '';
      updateCount();
      points.focus();
    });
  </script>
</body>
</html>
