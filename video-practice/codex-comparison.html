<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pathology Quick Review</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2933;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      width: min(90%, 420px);
      padding: 32px;
      background: #ffffff;
      border: 1px solid #d9e2ec;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(31, 41, 51, 0.08);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 2rem;
      color: #243b53;
    }

    ul {
      margin: 0;
      padding-left: 22px;
      line-height: 1.8;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Pathology Quick Review</h1>
    <ul>
      <li>Leukemia</li>
      <li>Anemia</li>
      <li>Lymphoma</li>
    </ul>
  </main>
</body>
</html>
