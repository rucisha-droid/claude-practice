<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pathology Points Tool</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #6a5ae0 0%, #8f6fe8 50%, #b18cf0 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    width: 100%;
    max-width: 560px;
    background: #ffffff;
    border-radius: 18px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    padding: 24px;
  }

  h1 {
    margin: 0 0 6px;
    font-size: 1.4rem;
    color: #2d2350;
  }

  p.subtitle {
    margin: 0 0 18px;
    font-size: 0.9rem;
    color: #6b6480;
  }

  textarea {
    width: 100%;
    min-height: 240px;
    resize: vertical;
    padding: 14px;
    font-size: 1rem;
    line-height: 1.5;
    border: 2px solid #e0dcf0;
    border-radius: 12px;
    color: #2d2350;
    outline: none;
    transition: border-color 0.2s ease;
    font-family: inherit;
  }

  textarea:focus {
    border-color: #6a5ae0;
  }

  .meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    font-size: 0.85rem;
    color: #8a83a0;
  }

  .status {
    font-weight: 600;
    color: #2fa967;
    opacity: 0;
    transition: opacity 0.2s ease;
  }

  .status.show {
    opacity: 1;
  }

  .buttons {
    display: flex;
    gap: 12px;
    margin-top: 16px;
  }

  button {
    flex: 1;
    padding: 14px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.08s ease, opacity 0.2s ease;
  }

  button:active {
    transform: scale(0.97);
  }

  .copy-btn {
    background: #6a5ae0;
    color: #fff;
  }

  .copy-btn:hover {
    background: #5847d4;
  }

  .clear-btn {
    background: #f1eefa;
    color: #4a4363;
  }

  .clear-btn:hover {
    background: #e5e0f5;
  }

  @media (max-width: 400px) {
    .buttons {
      flex-direction: column;
    }
  }
</style>
</head>
<body>

<div class="card">
  <h1>Pathology Points Tool</h1>
  <p class="subtitle">Paste or type your pathology points below, then copy them all in one tap.</p>

  <textarea id="pointsArea" placeholder="Enter pathology points here, one per line..."></textarea>

  <div class="meta-row">
    <span id="charCount">0 characters</span>
    <span id="statusMsg" class="status">Copied!</span>
  </div>

  <div class="buttons">
    <button class="copy-btn" id="copyBtn">Copy All Points</button>
    <button class="clear-btn" id="clearBtn">Clear</button>
  </div>
</div>

<script>
  const textarea = document.getElementById('pointsArea');
  const charCount = document.getElementById('charCount');
  const statusMsg = document.getElementById('statusMsg');
  const copyBtn = document.getElementById('copyBtn');
  const clearBtn = document.getElementById('clearBtn');

  function updateCharCount() {
    charCount.textContent = textarea.value.length + ' characters';
  }

  function showStatus() {
    statusMsg.classList.add('show');
    clearTimeout(showStatus._t);
    showStatus._t = setTimeout(() => statusMsg.classList.remove('show'), 1800);
  }

  textarea.addEventListener('input', updateCharCount);

  copyBtn.addEventListener('click', async () => {
    if (!textarea.value) return;
    try {
      await navigator.clipboard.writeText(textarea.value);
    } catch (err) {
      textarea.select();
      document.execCommand('copy');
    }
    showStatus();
  });

  clearBtn.addEventListener('click', () => {
    textarea.value = '';
    updateCharCount();
    textarea.focus();
  });

  updateCharCount();
</script>

</body>
</html>
